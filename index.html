<!DOCTYPE html>
<html>
<head>
  <title>DGMS Safety Helmet Demo</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body style="font-family: Arial; text-align:center; padding:40px;">

<h2>DGMS Safety Helmet Monitoring (DEMO MODE)</h2>

<h3>Temperature: <span id="temperature">--</span> °C</h3>
<h3>Gas Level: <span id="gas">--</span> PPM</h3>
<h3>Helmet Status: <span id="helmet">--</span></h3>
<h3>DGMS Score: <span id="score">--</span></h3>
<h3>Status: <span id="status">--</span></h3>

<hr>

<canvas id="chart" width="600" height="300"></canvas>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

// 🔹 Your Firebase config
const firebaseConfig = {
  apiKey: "AIzaSyAsZL4ynUt7c5oQPXMKMCUGjmHXRmNf3FA",
  authDomain: "smart-worker-helmet.firebaseapp.com",
  databaseURL: "https://smart-worker-helmet-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "smart-worker-helmet",
  storageBucket: "smart-worker-helmet.firebasestorage.app",
  messagingSenderId: "425355245105",
  appId: "1:425355245105:web:03145b1a5efd6924da4710"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const helmetRef = ref(db, "helmet/live");


// 🔥 DEMO DATA GENERATOR (NO ESP)
function sendDemoData() {

  const gas = Math.floor(Math.random() * 2500) + 1000;
  const temperature = Math.floor(Math.random() * 20) + 25;

  let helmet = true;
  let status = "SAFE";
  let score = 100;

  // Simulate danger every 10 seconds
  if (Math.floor(Date.now() / 10000) % 2 === 1) {
    helmet = false;
    status = "DGMS VIOLATION";
    score = 60;
  }

  set(helmetRef, {
    gas: gas,
    temperature: temperature,
    helmet: helmet,
    fall: false,
    sos: false,
    dgmsScore: score,
    status: status,
    compliance: helmet ? "COMPLIANT" : "NON-COMPLIANT",
    timestamp: Date.now()
  });
}

setInterval(sendDemoData, 3000);


// 📡 READ DATA FROM FIREBASE
onValue(helmetRef, (snapshot) => {
  const data = snapshot.val();
  if (!data) return;

  document.getElementById("temperature").textContent = data.temperature;
  document.getElementById("gas").textContent = data.gas;
  document.getElementById("helmet").textContent = data.helmet ? "WORN" : "NOT WORN";
  document.getElementById("score").textContent = data.dgmsScore;
  document.getElementById("status").textContent = data.status;

  updateChart(data.temperature, data.gas);
});


// 📊 Chart Setup
const ctx = document.getElementById('chart').getContext('2d');
let chart = new Chart(ctx, {
  type: 'line',
  data: {
    labels: [],
    datasets: [
      {
        label: 'Temperature',
        data: [],
        borderColor: 'red'
      },
      {
        label: 'Gas',
        data: [],
        borderColor: 'blue'
      }
    ]
  }
});

function updateChart(temp, gas) {

  const time = new Date().toLocaleTimeString();

  if (chart.data.labels.length > 10) {
    chart.data.labels.shift();
    chart.data.datasets[0].data.shift();
    chart.data.datasets[1].data.shift();
  }

  chart.data.labels.push(time);
  chart.data.datasets[0].data.push(temp);
  chart.data.datasets[1].data.push(gas);

  chart.update();
}

</script>

</body>
</html>
